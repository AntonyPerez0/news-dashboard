# Deploys the React dashboard to GitHub Pages and refreshes the static news
# data. Runs on every push, on demand, and on a schedule.
#
# The schedule asks for every 15 minutes, but GitHub runs scheduled workflows
# on a best-effort basis: in practice this one has run a few times a day, 3 to
# 10 hours apart. GitHub also disables the schedule after 60 days without
# repository activity; any commit resets that, and `gh workflow enable
# deploy.yml` turns it back on.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build        # typecheck + vite build → dist/
      - run: node scripts/generate-data.js
        env:
          # Optional repository variables; empty means the built-in defaults.
          NEWS_EDITION: ${{ vars.NEWS_EDITION }}
          NEWS_FEEDS_FILE: ${{ vars.NEWS_FEEDS_FILE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
