# Deploys the React dashboard to GitHub Pages and refreshes the static news
# data. Runs on every push and on demand.
#
# "On demand" is how the site stays fresh: the Cloudflare Worker in
# cloudflare/refresh-trigger starts this workflow every 15 minutes.
#
# There is deliberately no `schedule:` trigger. GitHub ran one every 3 to 10
# hours instead of every 15 minutes, and it disables scheduled workflows
# after 60 days without repository activity, which would stop the Worker's
# runs as well.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build        # typecheck + vite build → dist/
      - run: node scripts/generate-data.js
        env:
          # Optional repository variables; empty means the built-in defaults.
          NEWS_EDITION: ${{ vars.NEWS_EDITION }}
          NEWS_FEEDS_FILE: ${{ vars.NEWS_FEEDS_FILE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
