<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — News Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      color: #edf0f6;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .inner { max-width: 420px; padding: 32px; }
    .logo { display: flex; gap: 5px; justify-content: center; margin-bottom: 22px; }
    .logo div { width: 13px; height: 13px; border-radius: 3px; }
    h1 { font-size: 17px; letter-spacing: 3px; margin: 0 0 10px; font-weight: 800; }
    .code { font-size: 52px; font-weight: 800; color: #3d7bff; margin: 0 0 10px; letter-spacing: 2px; }
    p { color: #98a2b6; font-size: 14px; line-height: 1.6; margin: 0 0 26px; }
    a {
      display: inline-block;
      padding: 11px 26px;
      border-radius: 9px;
      background: #3d7bff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    a:hover { background: #2f6ae8; }
  </style>
  <meta http-equiv="refresh" content="10;url=https://newsdash.page/" />
</head>
<body>
  <div class="inner">
    <div class="logo" aria-hidden="true">
      <div style="background:#4f8cff"></div>
      <div style="background:#3fc1a9"></div>
      <div style="background:#b07cf5"></div>
      <div style="background:#ff9a62"></div>
    </div>
    <div class="code">404</div>
    <h1>PAGE NOT FOUND</h1>
    <p>That page doesn't exist. Taking you back to the dashboard in a moment.</p>
    <a href="/news-dashboard/">Go to the dashboard</a>
  </div>
</body>
</html>
