<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' rx='1.5' fill='%234f8cff'/%3E%3Crect x='9' width='7' height='7' rx='1.5' fill='%233fc1a9'/%3E%3Crect y='9' width='7' height='7' rx='1.5' fill='%23b07cf5'/%3E%3Crect x='9' y='9' width='7' height='7' rx='1.5' fill='%23ff9a62'/%3E%3C/svg%3E" />
</head>
<body>
  <header>
    <div class="brand">NEWS<span>DASH</span></div>
    <nav id="cats" class="cats" aria-label="News categories"></nav>
    <div class="right">
      <span id="pause-chip" class="chip hidden">PAUSED</span>
      <span id="updated" title="Last successful update"></span>
      <span id="clock"></span>
      <button id="fs-btn" title="Toggle fullscreen (F)" aria-label="Toggle fullscreen">
        <svg id="fs-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" />
        </svg>
      </button>
    </div>
  </header>

  <main id="grid" role="main"></main>

  <div id="toast" role="status"></div>

  <script src="/app.js" defer></script>
</body>
</html>
